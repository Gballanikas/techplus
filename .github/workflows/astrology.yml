name: Build AstroChart APK
on:
  push:
    branches: [main]
    paths:
      - 'AstroChart/**'
      - '.github/workflows/astrology.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Download Astronomy Engine 2.1.19 source
        working-directory: AstroChart
        run: |
          mkdir -p app/src/main/java/io/github/cosinekitty/astronomy
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/cosinekitty/astronomy/v2.1.19/source/kotlin/src/main/kotlin/io/github/cosinekitty/astronomy/astronomy.kt" --output app/src/main/java/io/github/cosinekitty/astronomy/astronomy.kt
      - name: Apply wheel rendering changes
        working-directory: AstroChart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/gballanikas/astrochart/MainActivity.kt')
          s = p.read_text()
          s = s.replace(
              'private val zodiacGlyph = listOf("♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓")',
              'private val zodiacGlyph = listOf("♈︎", "♉︎", "♊︎", "♋︎", "♌︎", "♍︎", "♎︎", "♏︎", "♐︎", "♑︎", "♒︎", "♓︎")'
          )
          s = s.replace(
              'paint.color = android.graphics.Color.rgb(221, 230, 242)\n                paint.textSize = with(density) { 58.sp.toPx() }',
              'paint.color = android.graphics.Color.rgb(255, 59, 59)\n                paint.textSize = with(density) { 25.sp.toPx() }'
          )
          s = s.replace(
              'canvas.nativeCanvas.drawText(glyph, p.x, p.y + with(density) { 14.dp.toPx() }, paint)',
              'canvas.nativeCanvas.drawText(glyph, p.x, p.y + with(density) { 6.dp.toPx() }, paint)'
          )
          s = s.replace(
              'val aspectRadius = radius * .56f\n            val planetRadius = radius * .66f',
              'val aspectRadius = radius * .64f\n            val planetRadius = radius * .72f'
          )
          s = s.replace(
              'paint.color = android.graphics.Color.rgb(255, 209, 102)\n                paint.textSize = with(density) { 25.sp.toPx() }',
              'paint.color = android.graphics.Color.rgb(255, 209, 102)\n                paint.textSize = with(density) { 12.5.sp.toPx() }'
          )
          s = s.replace(
              'canvas.nativeCanvas.drawText(p.glyph, point.x, point.y + with(density) { 6.dp.toPx() }, paint)\n                }',
              'canvas.nativeCanvas.drawText(p.glyph, point.x, point.y + with(density) { 3.dp.toPx() }, paint)\n                }'
          )
          s = s.replace(
              'paint.textSize = with(density) { 12.5.sp.toPx() }\n                positions.forEach { p ->\n                    val point = wheelPoint(center, planetRadius, p.longitude)\n                    canvas.nativeCanvas.drawText(p.glyph, point.x, point.y + with(density) { 3.dp.toPx() }, paint)\n                }',
              'paint.textSize = with(density) { 12.5.sp.toPx() }\n                positions.forEach { p ->\n                    val point = wheelPoint(center, planetRadius, p.longitude)\n                    canvas.nativeCanvas.drawText(p.glyph, point.x, point.y + with(density) { 3.dp.toPx() }, paint)\n                    val totalSeconds = kotlin.math.round(p.longitude * 240.0).toInt()\n                    val degrees = (totalSeconds / 240) % 360\n                    val minutes = (totalSeconds % 240) / 4\n                    val seconds = (totalSeconds % 4) * 15\n                    paint.color = android.graphics.Color.rgb(184, 194, 209)\n                    paint.textSize = with(density) { 7.5.sp.toPx() }\n                    paint.textAlign = Paint.Align.LEFT\n                    canvas.nativeCanvas.drawText(String.format(java.util.Locale.US, "%03d°%02d\\\'%02d\\\"", degrees, minutes, seconds), point.x + with(density) { 7.dp.toPx() }, point.y + with(density) { 2.dp.toPx() }, paint)\n                    paint.textAlign = Paint.Align.CENTER\n                    paint.color = android.graphics.Color.rgb(255, 209, 102)\n                    paint.textSize = with(density) { 12.5.sp.toPx() }\n                }'
          )
          s = s.replace(
              'OutlinedTextField(name, { name = it }, label = { Text("Name") }, modifier = Modifier.fillMaxWidth())',
              'OutlinedTextField(name, { name = it }, label = { Text("Name") }, modifier = Modifier.fillMaxWidth(), textStyle = androidx.compose.material3.LocalTextStyle.current.copy(color = planetColor))'
          )
          s = s.replace(
              'OutlinedTextField(city, { city = it }, label = { Text("City / location") }, modifier = Modifier.fillMaxWidth())',
              'OutlinedTextField(city, { city = it }, label = { Text("City / location") }, modifier = Modifier.fillMaxWidth(), textStyle = androidx.compose.material3.LocalTextStyle.current.copy(color = planetColor))'
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: AstroChart
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AstroChart-APK
          path: AstroChart/app/build/outputs/apk/debug/app-debug.apk
