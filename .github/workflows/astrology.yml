name: Build AstroChart APK
# Trigger AstroChart build
on:
  push:
    branches: [main]
    paths:
      - 'AstroChart/**'
      - '.github/workflows/astrology.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download Astronomy Engine 2.1.19 source
        working-directory: AstroChart
        run: |
          mkdir -p app/src/main/java/io/github/cosinekitty/astronomy
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/cosinekitty/astronomy/v2.1.19/source/kotlin/src/main/kotlin/io/github/cosinekitty/astronomy/astronomy.kt" --output app/src/main/java/io/github/cosinekitty/astronomy/astronomy.kt
      - name: Verify and correct AstroChart source
        working-directory: AstroChart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app/src/main/java/com/gballanikas/astrochart/MainActivity.kt')
          s = p.read_text()
          marker = 'import androidx.compose.ui.graphics.drawscope.drawIntoCanvas\n'
          if 'import androidx.compose.ui.graphics.nativeCanvas' not in s:
              s = s.replace(marker, marker + 'import androidx.compose.ui.graphics.nativeCanvas\n', 1)
          start = s.index('private fun calculatePlacidusHouses(')
          end = s.index('private fun searchLocationsAsync(', start)
          encoded = ' '
          corrected = base64.b64decode(encoded).decode()
          s = s[:start] + corrected + s[end:]
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: AstroChart
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AstroChart-APK
          path: AstroChart/app/build/outputs/apk/debug/app-debug.apk
